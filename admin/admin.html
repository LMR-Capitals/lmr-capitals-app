<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LMR Capitals — Admin</title>
<link rel="icon" href="/icons/favicon-32.png">
<style>
  html,body{margin:0;background:#05070d;color:#EDF2FF;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #root{min-height:100vh}
  /* first-paint loader so the page is never blank before React mounts */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  #boot .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(233,180,76,.25);border-top-color:#E9B44C;animation:spin .8s linear infinite}
  #boot .lbl{letter-spacing:.35em;font-size:13px;color:#8b93a7;font-weight:700}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"><div id="boot"><div class="ring"></div><div class="lbl">LMR ADMIN</div></div></div>
<script type="module" src="./main.jsx"></script>
</body>
</html>
