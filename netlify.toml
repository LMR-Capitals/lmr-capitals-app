# LMR Capitals — production deploy config (authoritative; overrides dashboard).
# Vite multi-page build from top-level surface folders (web/, app/, admin/), built
# at the repo root. Output lands under dist/web, dist/app and dist/admin; shared
# static assets in public/ (sw.js, manifest.json, chart.umd.min.js, icons/, …) are
# flattened to the dist root. The redirects below map the clean public URLs:
#   /        → landing        (dist/web/index.html)
#   /app     → trading app    (dist/app/app.html)
#   /admin   → admin portal   (dist/admin/admin.html)
[build]
  # base "." = repo root. Set explicitly so this file (not a stale dashboard
  # "base directory" setting) is authoritative; the build runs from the root.
  base = "."
  command = "npm ci && npm run build"
  publish = "dist"

# ── Clean URLs (rewrites, status 200) ─────────────────────────────────────
[[redirects]]
  from = "/"
  to = "/web/index.html"
  status = 200

# Stripe's existing checkout function returns to /index.html?checkout=... .
# Send that callback to the app, where the entitlement refresh is handled.
[[redirects]]
  from = "/index.html"
  to = "/app/app.html"
  status = 302
  query = { checkout = ":state" }

[[redirects]]
  from = "/app"
  to = "/app/app.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/admin.html"
  status = 200

[[redirects]]
  from = "/admin/terminal"
  to = "/admin/terminal.html"
  status = 200

[[headers]]
  for = "/admin/terminal.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/landing-preview"
  to = "/web/landing-preview.html"
  status = 200

# Existing checkout links return to /index.html; preserve their query string
# and hand the user back to the trading app.
[[redirects]]
  from = "/index.html"
  to = "/app/app.html"
  status = 302
  query = { checkout = ":state" }

# ── HTML — never cache (ensures updates deploy instantly) ──────────────────
[[headers]]
  for = "/web/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/app/app.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/admin/admin.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ── Service Worker — no cache ──────────────────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "application/javascript"

# ── Web App Manifest — short cache ────────────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/manifest+json"

# ── Static assets — long cache ─────────────────────────────────────────────
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (all routes) ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"

# Only the dedicated Journal workspace entry can be embedded, on this origin.
[[headers]]
  for = "/app/workspace.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/web/*"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/inner-circle*"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/members"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/member/*"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/app"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/app/app.html"
  [headers.values]
    X-Frame-Options = "DENY"
[[headers]]
  for = "/app/journal-import*"
  [headers.values]
    X-Frame-Options = "DENY"

# Inner Circle member application
[[redirects]]
  from = "/inner-circle/guide"
  to = "/member/guide.html"
  status = 200

[[headers]]
  for = "/inner-circle/guide"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/member/guide.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/members"
  to = "/inner-circle"
  status = 302

[[redirects]]
  from = "/inner-circle"
  to = "/member/index.html"
  status = 200

[[headers]]
  for = "/inner-circle"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/member/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
