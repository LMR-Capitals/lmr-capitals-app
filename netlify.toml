# LMR Capitals — production deploy config (authoritative; overrides dashboard).
# Vite multi-page build from top-level surface folders (web/, app/, admin/), built
# at the repo root. Output lands under dist/web, dist/app and dist/admin; shared
# static assets in public/ (sw.js, manifest.json, chart.umd.min.js, icons/, …) are
# flattened to the dist root. The redirects below map the clean public URLs:
#   /        → landing        (dist/web/index.html)
#   /app     → trading app    (dist/app/app.html)
#   /admin   → admin portal   (dist/admin/admin.html)
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# ── Clean URLs (rewrites, status 200) ─────────────────────────────────────
[[redirects]]
  from = "/"
  to = "/web/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app/app.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/admin.html"
  status = 200

[[redirects]]
  from = "/landing-preview"
  to = "/web/landing-preview.html"
  status = 200

# ── HTML — never cache (ensures updates deploy instantly) ──────────────────
[[headers]]
  for = "/web/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/app/app.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/admin/admin.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ── Service Worker — no cache ──────────────────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "application/javascript"

# ── Web App Manifest — short cache ────────────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/manifest+json"

# ── Static assets — long cache ─────────────────────────────────────────────
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (all routes) ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
