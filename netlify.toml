# LMR Capitals — production deploy config (authoritative; overrides dashboard).
# The app lives in app/ and is a Vite multi-page build (index.html + landing.html).
# Static root-served assets (sw.js, manifest.json, chart.umd.min.js, icons/) live
# in app/public/ and are flattened to the site root by `vite build` into app/dist.
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

# Clean URL for the standalone admin web portal: /admin serves admin.html.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# ── HTML — never cache (ensures updates deploy instantly) ──────────────────
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/landing.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# ── Service Worker — no cache ──────────────────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "application/javascript"

# ── Web App Manifest — short cache ────────────────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/manifest+json"

# ── Static assets — long cache ─────────────────────────────────────────────
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers (all routes) ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
