<!-- ============================================================
     LMR CAPITALS · P/D ARRAY COMMITMENT (Today / The Chain)
     Paste-ready for LMR Capitals APP.html. Three parts:
       1. <style id="lmr-pd-css">   -> paste into <head>
       2. <div id="lmr-pd">         -> paste inside the Chain panel,
          plus <div id="lmr-pd-block"> anywhere before </body>
       3. <script id="lmr-pd-js">   -> paste before </body>

     WIRING THE HARD BLOCK - in your Add Trade save handler, first line:
         if (!PD.check(selectedModels)) return;
     where selectedModels is the array of model names on the trade.

     CHART PATHS - each array carries a charts array pointing at the
     extracted reference images. Copy the kb/ folder next to your HTML,
     or rewrite the paths to wherever you host them.
     ============================================================ -->

<style id="lmr-pd-css">
#lmr-pd{
  --pd-surface:var(--bg2,#101018); --pd-inset:var(--bg3,#14141C);
  --pd-line:var(--border,rgba(255,255,255,0.08));
  --pd-txt:var(--text1,#EDEDF2); --pd-mut:var(--text2,#A0A0B0); --pd-dim:var(--text3,#7A7A8C);
  --pd-gold:var(--gold,#F5A623); --pd-rose:var(--bear,#FF4060);
  font-family:'Inter',system-ui,sans-serif; color:var(--pd-txt);
  display:flex; flex-direction:column; gap:12px;
}
#lmr-pd .pd-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#lmr-pd .pd-eyebrow{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#lmr-pd .pd-hint{font-size:12px;color:var(--pd-dim)}
#lmr-pd .pd-sheet{border:1px solid var(--pd-gold);border-radius:10px;background:color-mix(in srgb,var(--pd-gold) 5%,var(--pd-surface));overflow:hidden}
#lmr-pd .pd-sheet-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 14px;border-bottom:1px solid var(--pd-line)}
#lmr-pd .pd-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;padding:3px 9px;border-radius:99px;background:var(--pd-gold);color:#0A0A0F}
#lmr-pd .pd-name{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:16px}
#lmr-pd .pd-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--pd-dim)}
#lmr-pd .pd-thesis{margin:0;padding:13px 14px 0;font-size:14px;line-height:1.65;color:var(--pd-mut)}
#lmr-pd .pd-invalid{display:flex;align-items:flex-start;gap:9px;margin:12px 14px;padding:10px 12px;border-radius:8px;border:1px solid color-mix(in srgb,var(--pd-rose) 30%,transparent);background:color-mix(in srgb,var(--pd-rose) 8%,transparent)}
#lmr-pd .pd-invalid b{flex:none;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--pd-rose);padding-top:2px}
#lmr-pd .pd-invalid span{font-size:13px;line-height:1.55}
#lmr-pd .pd-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--pd-line);border-top:1px solid var(--pd-line);border-bottom:1px solid var(--pd-line)}
#lmr-pd .pd-meta div{display:flex;flex-direction:column;gap:3px;padding:10px 14px;background:var(--pd-surface);min-width:0}
#lmr-pd .pd-meta b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--pd-dim)}
#lmr-pd .pd-meta span{font-family:'JetBrains Mono',monospace;font-size:11px}
#lmr-pd .pd-row{border-bottom:1px solid var(--pd-line)}
#lmr-pd .pd-row-btn{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 14px;cursor:pointer;border:0;background:transparent;color:var(--pd-txt)}
#lmr-pd .pd-row-btn:hover{background:var(--pd-inset)}
#lmr-pd .pd-mark{flex:none;width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:5px;border:1px solid var(--pd-line);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--pd-gold)}
#lmr-pd .pd-row-lbl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em}
#lmr-pd .pd-row-sub{font-size:11px;color:var(--pd-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lmr-pd .pd-body{padding:0 14px 13px 44px;display:none}
#lmr-pd .pd-row.open .pd-body{display:block}
#lmr-pd .pd-body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
#lmr-pd .pd-body li{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.6;color:var(--pd-mut)}
#lmr-pd .pd-body li::before{content:'';flex:none;width:4px;height:4px;border-radius:99px;background:var(--pd-gold);margin-top:8px}
#lmr-pd .pd-body p{margin:0;font-size:13px;line-height:1.7;color:var(--pd-mut)}
#lmr-pd .pd-shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px}
#lmr-pd .pd-shots img{width:100%;display:block;border:1px solid var(--pd-line);border-radius:6px;background:var(--pd-inset)}
#lmr-pd .pd-set{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
#lmr-pd .pd-set-lbl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;color:var(--pd-gold)}
#lmr-pd .pd-switches{display:flex;flex-direction:column;gap:5px;padding:11px 14px}
#lmr-pd .pd-switches b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--pd-rose)}
#lmr-pd .pd-switches span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--pd-dim)}
#lmr-pd .pd-pickhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:13px 0 9px}
#lmr-pd .pd-pickhead b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em}
#lmr-pd .pd-grp{display:flex;flex-direction:column;gap:7px;margin-bottom:13px;min-width:0}
#lmr-pd .pd-grp>b{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--pd-dim)}
#lmr-pd .pd-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px}
#lmr-pd .pd-card{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;padding:9px 12px;cursor:pointer;border-radius:8px;border:1px solid var(--pd-line);background:var(--pd-surface);color:var(--pd-txt);min-width:0}
#lmr-pd .pd-card:hover{border-color:var(--pd-gold)}
#lmr-pd .pd-card i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--pd-gold)}
#lmr-pd .pd-card em{font-style:normal;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px}
#lmr-pd .pd-card small{font-size:11px;line-height:1.45;color:var(--pd-dim)}
#lmr-pd .pd-btn{padding:6px 13px;cursor:pointer;border-radius:99px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:10px;letter-spacing:.06em}
#lmr-pd .pd-btn-gold{border:1px solid var(--pd-gold);background:color-mix(in srgb,var(--pd-gold) 12%,transparent);color:var(--pd-gold)}
#lmr-pd .pd-btn-ghost{border:1px solid var(--pd-line);background:transparent;color:var(--pd-dim)}
#lmr-pd .pd-confirm{margin-top:11px;padding:13px 14px;border:1px solid var(--pd-rose);border-radius:10px;background:color-mix(in srgb,var(--pd-rose) 7%,var(--pd-surface));display:flex;flex-direction:column;gap:9px}
#lmr-pd .pd-confirm b{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:13px}
#lmr-pd .pd-confirm p{margin:0;font-size:13px;line-height:1.6;color:var(--pd-mut)}
#lmr-pd .pd-confirm .row{display:flex;gap:8px;flex-wrap:wrap}
#lmr-pd .pd-go{padding:8px 17px;cursor:pointer;border:0;border-radius:99px;background:var(--pd-rose);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:11px}
#lmr-pd .pd-keep{padding:8px 17px;cursor:pointer;border:1px solid var(--pd-line);border-radius:99px;background:transparent;color:var(--pd-txt);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px}
#lmr-pd-block{position:fixed;z-index:9000;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
#lmr-pd-block.on{display:flex}
#lmr-pd-block .box{width:min(500px,100%);border:1px solid var(--bear,#FF4060);border-radius:12px;background:var(--bg2,#101018);overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:var(--text1,#EDEDF2)}
#lmr-pd-block .top{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border,rgba(255,255,255,.08));background:color-mix(in srgb,var(--bear,#FF4060) 9%,transparent)}
#lmr-pd-block .bang{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:99px;background:var(--bear,#FF4060);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:13px}
#lmr-pd-block h4{margin:0;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:15px}
#lmr-pd-block p{margin:0;padding:16px 18px;font-size:14px;line-height:1.7;color:var(--text2,#A0A0B0)}
#lmr-pd-block .acts{display:flex;gap:9px;flex-wrap:wrap;padding:0 18px 17px}
#lmr-pd-block .acts button{padding:10px 19px;cursor:pointer;border-radius:99px;font-family:'Space Grotesk',sans-serif;font-size:12px}
#lmr-pd-block .primary{border:0;background:var(--gold,#F5A623);color:#0A0A0F;font-weight:800}
#lmr-pd-block .secondary{border:1px solid var(--border,rgba(255,255,255,.08));background:transparent;color:var(--text1,#EDEDF2);font-weight:700}
</style>
<style>
  body{margin:0;background:#0A0A0F;color:#EDEDF2;font-family:Inter,system-ui,sans-serif;padding:32px}
  .demo{max-width:900px;margin:0 auto}
  .demo>p{color:#7A7A8C;font-size:13px;margin:0 0 20px}
</style>
</head>
<body>
<div class="demo">
  <p>Live preview of the section below. The three paste-in parts are in this file’s source.</p>
<div id="lmr-pd"></div>

<div id="lmr-pd-block">
  <div class="box">
    <div class="top"><span class="bang">!</span><h4 id="lmr-pd-block-title">—</h4></div>
    <p id="lmr-pd-block-body">—</p>
    <div class="acts">
      <button class="primary" onclick="PD.goCommit()">Open the chain</button>
      <button class="secondary" onclick="PD.closeBlock()">Cancel the trade</button>
    </div>
  </div>
</div>
</div>
<script id="lmr-pd-js">
/* ============================================================

   One array per trading day. Committing it hides the other
   fifteen and arms a hard block on trade entry; switching is
   allowed but confirmed and logged.

   Reads / writes:  state.chain.pdArray, state.chain.pdSwitches
   Call PD.check(models) from your Add Trade save handler.
   Persistence hook: PD_PERSIST at the bottom.
   ============================================================ */
(function () {
  var ARRAYS = [
      { id:'rb',
        charts:['kb/n00.png','kb/n01.png','kb/n02.png'], name:'Rejection Block', group:'Rejection', short:'RB',
        thesis:'Price violently rejects a level after displacement — aggressive institutional rejection, then continuation in the opposite direction.',
        invalid:'No untouched or engineered liquidity is resting above/below after the block forms.',
        formation:['Violent rejection of a level immediately after displacement.',
                   'Valid only when price respected the 50% to 75% quadrant levels.',
                   'The rejection wick, not the body, defines the block.'],
        entry:['Untouched liquidity, or engineered liquidity, resting above/below once the RB is formed.',
               'Enter on the return into the block, in the direction opposite the rejection.'],
        confirm:['Resting liquidity still unpurged on the side you are delivering toward.',
                 'Quadrant respect between 50% and 75% — outside that range the block is not valid.'],
        why:'A violent rejection after displacement is the algorithm refusing price at a level it has already priced in. The rejection itself is the footprint; the untouched liquidity beyond it is the reason price must come back. Without that resting liquidity there is nothing drawing price, and the block is only a wick.',
        sessions:['London 1','London 2','NY AM','NY PM'], timeframes:['15m','1H','4H'],
        models:['Turtle Soup','OB','IOFED','Breaker Block'] },

      { id:'ob',
        charts:['kb/n03.png','kb/n04.png','kb/n05.png','kb/n06.png','kb/n07.png','kb/n08.png','kb/n09.png','kb/n10.png','kb/n11.png','kb/n12.png'], name:'Order Block', group:'Order flow', short:'OB',
        thesis:'The last opposing candle before displacement, taken only once liquidity has been purged in the determined bias.',
        invalid:'HTF key levels absent, bias unclear, or the recent short-term high/low did not close after the OB formed.',
        formation:['The last opposing candle before displacement — the last down candle before an up move, the last up candle before a down move.',
                   'Not necessarily a single candle: a series of closed candles in one direction for the opposite run.',
                   'Formed as the last closed candles inside a P/D area.',
                   'HTF key levels must already be present before the displacement.'],
        entry:['OB must sit below/above swings, after stop hunts.',
               'Recent short-term high/low has to close after the OB forms.',
               'Market structure shift present — the setup is mostly ideal only with it.',
               'Liquidity-purged candles are the ideal ones; unpurged candles are not.'],
        confirm:['Daily bias / 4H bias follows the narrative.',
                 'Clean direction and draws — these enhance the OB.',
                 'Draws and bias both clear and valid.'],
        why:'An order block marks where institutions had to leave unfilled orders before moving price away. That is only true when liquidity was purged first — the purge is what funded the move. If the structure never shifted and the short-term high or low never closed beyond it, the candle you are looking at was not the last opposing candle; price simply has not finished delivering yet.',
        sessions:['London 1','London 2','NY AM','NY PM'], timeframes:['15m','1H','4H','Daily'],
        models:['OB','Breaker Block','IOFED','CSID'] },

      { id:'pb',
        charts:['kb/n13.png','kb/n14.png','kb/n15.png'], name:'Propulsion Block', group:'Order flow', short:'PB',
        thesis:'Price returns to a prior candle body after displacement and continues in the same direction.',
        invalid:'Conditions are not trending — a propulsion block is a continuation tool only.',
        formation:['Displacement away from a candle body.','Price returns into that same body.','Delivery continues in the original direction.'],
        entry:['Continuation entry on the return into the prior body, during trending conditions.'],
        confirm:['An established trend — this is not a reversal array.'],
        why:'The body being revisited already holds positions in the direction of travel. Returning to it lets the algorithm add without giving up the level, which is why continuation from a propulsion block is cleaner in a trend and meaningless in a range.',
        sessions:['London 2','NY AM','NY PM'], timeframes:['5m','15m','1H'],
        models:['OB','IOFED','CSID'] },

      { id:'fvg',
        charts:['kb/n16.png','kb/n17.png','kb/n18.png','kb/n19.png','kb/n20.png','kb/n21.png','kb/n22.png'], name:'Fair Value Gap', group:'Imbalance', short:'FVG',
        thesis:'A three-candle imbalance left by displacement — inefficient delivery that price returns to rebalance before continuing.',
        invalid:'No stop hunt after the displacement, price not at a deep P/D array, or the gap sits at EQ.',
        formation:['Three-candle imbalance created during displacement.',
                   'Liquidity purged in HTF delivery, then a displacing gap.',
                   'Equal resting liquidity after displacement is the highest-probability version.'],
        entry:['Trade only an FVG created with a stop hunt after displacing.',

        confirm:['HTF key levels present.','Price at a deep P/D array.',
                 'Draws aligned with HTF key levels.','Daily / 4H bias following the narrative.'],
        why:'A gap is where price moved too fast for both sides to trade. The algorithm returns to rebalance it — but only when the gap was created by a move that took liquidity first. At EQ there is no premium or discount edge, and an FVG approaching an HTF key level has no room left to deliver, which is why both are avoided regardless of how clean the gap looks.',
        sessions:['London 1','London 2','NY AM','NY PM'], timeframes:['5m','15m','1H','4H'],
        models:['IFVG','OB','Breaker Block','IOFED','CSID','OTE'] },

      { id:'bisi',
        charts:['kb/n24.png'], name:'BISI', group:'Imbalance', short:'BISI',
        thesis:'Buy-side imbalance, sell-side inefficiency — a bullish gap where discount dominated and price delivered upward too quickly.',
        invalid:'Price is in premium rather than discount, or the upward move took no liquidity.',
        formation:['Price moves upward aggressively.','Sell-side trading did not occur efficiently.','Discount market dominated.'],
        entry:['Retracement into the gap to rebalance, then continuation higher.'],
        confirm:['Institutional buying pressure visible.','Algorithm seeking buy-side liquidity above.'],
        why:'The inefficiency is one-directional: buyers were filled, sellers were not. Price returns to offer those sellers a fill, which is what makes the retracement predictable — and why it only works from discount, where there is somewhere above to deliver to.',
        sessions:['London 1','NY AM'], timeframes:['5m','15m','1H'],
        models:['IFVG','OB','OTE','IOFED','CSID'] },

      { id:'sibi',
        charts:['kb/n23.png'], name:'SIBI', group:'Imbalance', short:'SIBI',
        thesis:'Sell-side imbalance, buy-side inefficiency — a bearish gap where premium dominated and price delivered downward too quickly.',
        invalid:'Price is in discount rather than premium, or the downward move took no liquidity.',
        formation:['Price delivers aggressively to the downside.','Buy-side trading did not occur efficiently.','Premium market dominated.'],
        entry:['Retracement into the SIBI, then continuation lower.'],
        confirm:['Strong bearish institutional order flow.','Algorithm delivering price to sell-side targets below.'],
        why:'The mirror of BISI. Sellers were filled on the way down and buyers were not, so price retraces into the gap to fill them before continuing. From premium there is sell-side liquidity below worth delivering to; from discount there is not.',
        sessions:['London 1','NY AM'], timeframes:['5m','15m','1H'],
        models:['IFVG','OB','OTE','IOFED','CSID'] },

      { id:'bpr',
        charts:['kb/n25.png','kb/n26.png'], name:'Balance Price Range', group:'Imbalance', short:'BPR',
        thesis:'Buyers and sellers have both left inefficiencies in the same area — an overlapping two-sided imbalance.',
        invalid:'Only one side has delivered an inefficiency; that is a plain FVG, not a BPR.',
        formation:['A bullish and a bearish imbalance overlap in the same price area.','Both sides delivered inefficiently.'],
        entry:['Treat the overlap as support or resistance.','Trade the reaction from the zone, or the expansion away from it.'],
        confirm:['Consolidation and order accumulation inside the range.','Signs of re-accumulation before the next displacement.'],
        why:'Two opposing inefficiencies in one place means neither side was satisfied. That makes the zone a natural place for orders to accumulate — it holds as support or resistance while the algorithm builds, then releases into the next displacement.',
        sessions:['London 2','NY AM','NY PM'], timeframes:['15m','1H','4H'],
        models:['IFVG','OB','Breaker Block','CSID'] },

      { id:'ifvg',
        charts:['kb/n27.png','kb/n28.png','kb/n29.png'], name:'Inversion FVG', group:'Imbalance', short:'IFVG',
        thesis:'A prior FVG has been violated and flipped — the market now uses it as opposite-side liquidity.',
        invalid:'The original gap was never actually violated; it is still an FVG in its first direction.',
        formation:['A previously respected FVG gets violated.','The imbalance is invalidated and flips direction.'],
        entry:['Trade the flipped gap as the opposite side, in the new direction of order flow.'],
        confirm:['A shift in order flow.','Market structure shift.','Reversal context rather than continuation.'],
        why:'When price trades fully through a gap that should have held, the thesis behind that gap is dead. The level does not disappear — it changes sides, and becomes the reference the algorithm uses to deliver the other way. The violation itself is the signal.',
        sessions:['London 2','NY AM','NY PM'], timeframes:['5m','15m','1H'],
        models:['IFVG','Breaker Block','CSID','IOFED'] },

      { id:'lvoid',
        charts:['kb/n30.png','kb/n31.png'], name:'Liquidity Void', group:'Imbalance', short:'Void',
        thesis:'Large displacement candles move rapidly with almost no retracement — trading levels were skipped entirely.',
        invalid:'The move retraced as it went; there is no genuine void.',
        formation:['Large displacement candles in sequence.','Almost no retracement within the move.'],
        entry:['Expect the void to be rebalanced; trade the return through it toward the draw.'],
        confirm:['The algorithm clearly delivered price aggressively through the range.'],
        why:'A void is the most extreme form of inefficiency — whole levels with no two-sided trade. Price eventually revisits because those levels were never auctioned, but the aggression that created it means it can stay unfilled far longer than an ordinary gap.',
        sessions:['London 1','NY AM'], timeframes:['15m','1H','4H'],
        models:['IOFED','CSID','OB'] },

      { id:'susp',
        charts:['kb/n32.png','kb/n33.png','kb/n34.png','kb/n35.png','kb/n36.png','kb/n37.png','kb/n38.png','kb/n39.png','kb/n40.png'], name:'Suspension Block', group:'Suspension', short:'SB',
        thesis:'A three-candle structure where the middle body leaves voids on both sides while the wicks overlap — price is suspended between acceptance levels.',
        invalid:'You are attempting to trade inside the block. Trade only its break or mitigation.',
        formation:['Candle 2\u2019s body gaps relative to both Candle 1 and Candle 3 bodies.',
                   'The wicks still overlap — price traded through, but body acceptance was absent.',

        entry:['Do NOT trade inside the suspension block. Trade the break, or the mitigation, of it.',

        confirm:['Accumulation inside the void, choppy consolidation, spider-web price action.',

      { id:'vi',
        charts:['kb/n41.png','kb/n42.png','kb/n43.png','kb/n44.png'], name:'Volume Imbalance', group:'Imbalance', short:'VI',

        entry:['HTF key-level volatility must be present.',

  var PD = window.PD = { open: {}, picking: false, pending: null };

  function chain() {
    window.state = window.state || {};
    state.chain = state.chain || {};
    return state.chain;
  }
  function byId(id) { for (var i = 0; i < ARRAYS.length; i++) if (ARRAYS[i].id === id) return ARRAYS[i]; return null; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  PD.commit = function (id) {
    var a = byId(id); if (!a) return;
    chain().pdArray = id; PD.picking = false; PD.pending = null;
    PD_PERSIST(); PD.render();
    PD.toast('Committed to ' + a.name + ' \u2014 trades are now validated against it.');
  };

  PD.askSwitch = function (id) { PD.pending = id; PD.render(); };

  PD.doSwitch = function (id) {
    var c = chain(), from = byId(c.pdArray), to = byId(id); if (!to) return;
    c.pdSwitches = c.pdSwitches || [];
    var at = new Date().toTimeString().slice(0, 5);
    c.pdSwitches.push({ from: from ? from.name : '\u2014', to: to.name, at: at });
    c.pdArray = id; PD.pending = null; PD.picking = false;
    PD_PERSIST(); PD.render();
    PD.toast('Switched to ' + to.name + ' \u2014 logged at ' + at + '.');
  };

  PD.release = function () {
    chain().pdArray = ''; PD.pending = null; PD.picking = false;
    PD_PERSIST(); PD.render();
    PD.toast('Array released \u2014 commit one before logging a trade.');
  };

  PD.toggleRow = function (k) { PD.open[k] = !PD.open[k]; PD.render(); };
  PD.openPicker = function () { PD.picking = true; PD.render(); };
  PD.closePicker = function () { PD.picking = false; PD.pending = null; PD.render(); };
  PD.cancelSwitch = function () { PD.pending = null; PD.render(); };

  /* The hard block. In your Add Trade save handler, first line:
       if (!PD.check(selectedModels)) return;
     Returns true when the trade is allowed. */
  PD.check = function (models) {
    var id = chain().pdArray;
    if (!id) {
      PD.showBlock('No array committed',
        'Commit today\u2019s P/D array in the chain before logging a trade. ' +
        'The commitment is what the trade is validated against.');
      return false;
    }
    var a = byId(id); if (!a) return true;
    var picked = (models || []).filter(Boolean);
    if (!picked.length) return true;
    var off = picked.filter(function (m) { return a.models.indexOf(m) < 0; });
    if (!off.length) return true;
    PD.showBlock(off.join(', ') + ' is not part of ' + a.name,
      'Today is committed to ' + a.name + ', which covers ' + a.models.join(', ') +
      '. To take this trade, switch the day\u2019s array \u2014 the switch is logged.');
    return false;
  };

  PD.showBlock = function (title, body) {
    document.getElementById('lmr-pd-block-title').textContent = title;
    document.getElementById('lmr-pd-block-body').textContent = body;
    document.getElementById('lmr-pd-block').classList.add('on');
  };
  PD.closeBlock = function () { document.getElementById('lmr-pd-block').classList.remove('on'); };
  PD.goCommit = function () {
    PD.closeBlock(); PD.picking = true; PD.render();
    if (typeof showPanel === 'function') showPanel('chain');
    var el = document.getElementById('lmr-pd');
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
  };

  PD.toast = function (msg) {
    if (typeof toast === 'function') { toast(msg); return; }
    if (typeof showToast === 'function') { showToast(msg); return; }
    console.log('[PD]', msg);
  };

  function rowHtml(key, label, sub, items, prose, sets) {
    var open = !!PD.open[key], inner = '';
    if (sets) {
      for (var s = 0; s < sets.length; s++) {
        inner += '<div class="pd-set">' +
          (sets[s].label ? '<span class="pd-set-lbl">' + esc(sets[s].label) + '</span>' : '') +
          '<div class="pd-shots">' + sets[s].shots.map(function (src) {
            return '<img src="' + esc(src) + '" alt="">'; }).join('') + '</div></div>';
      }
    } else if (prose) {
      inner = '<p>' + esc(prose) + '</p>';
    } else {
      inner = '<ul>' + (items || []).map(function (x) { return '<li><span>' + esc(x) + '</span></li>'; }).join('') + '</ul>';
    }
    return '<div class="pd-row' + (open ? ' open' : '') + '">' +
      '<button class="pd-row-btn" onclick="PD.toggleRow(&quot;' + key + '&quot;)">' +
        '<span class="pd-mark">' + (open ? '\u2212' : '+') + '</span>' +
        '<span class="pd-row-lbl">' + esc(label) + '</span>' +
        '<span class="pd-row-sub">' + esc(sub) + '</span>' +
      '</button><div class="pd-body">' + inner + '</div></div>';
  }

  PD.render = function () {
    var host = document.getElementById('lmr-pd'); if (!host) return;
    var c = chain(), cur = byId(c.pdArray), picking = !cur || PD.picking;
    var h = '<div class="pd-head"><span class="pd-eyebrow">Today\u2019s P/D array</span>' +
      '<span class="pd-hint">' + (cur ? 'Committed \u2014 trades are validated against it'
        : 'Commit one array; the rest are then hidden') + '</span></div>';

    if (cur) {
      h += '<div class="pd-sheet"><div class="pd-sheet-top">' +
        '<span class="pd-badge">' + esc(cur.short) + '</span>' +
        '<span class="pd-name">' + esc(cur.name) + '</span>' +
        '<span class="pd-group">' + esc(cur.group) + '</span>' +
        '<button class="pd-btn pd-btn-gold" style="margin-left:auto" onclick="PD.openPicker()">Switch array</button>' +
        '<button class="pd-btn pd-btn-ghost" onclick="PD.release()">Release</button></div>' +
        '<p class="pd-thesis">' + esc(cur.thesis) + '</p>' +
        '<div class="pd-invalid"><b>Invalid</b><span>' + esc(cur.invalid) + '</span></div>' +
        '<div class="pd-meta">' +
          '<div><b>Sessions</b><span>' + esc(cur.sessions.join(' \u00b7 ')) + '</span></div>' +
          '<div><b>Timeframes</b><span>' + esc(cur.timeframes.join(' \u00b7 ')) + '</span></div>' +
          '<div><b>Models allowed</b><span>' + esc(cur.models.join(' \u00b7 ')) + '</span></div>' +
        '</div>';
      h += rowHtml('formation', 'Formation', 'What must have happened for this array to exist', cur.formation);
      h += rowHtml('entry', 'Entry', 'The precise conditions for taking it', cur.entry);
      h += rowHtml('confirm', 'Confirmation', 'What must align \u2014 session, timeframe, confluence', cur.confirm);
      h += rowHtml('why', 'Why it works', 'The reasoning, in full', null, cur.why);
      var sets = cur.chartSets || (cur.charts && cur.charts.length ? [{ label: '', shots: cur.charts }] : null);
      if (sets) {
        var total = 0; sets.forEach(function (s) { total += s.shots.length; });
        h += rowHtml('charts', 'Charts', total + ' from the LMR reference', null, null, sets);
      }
      if ((c.pdSwitches || []).length) {
        h += '<div class="pd-switches"><b>Switched today</b>' + c.pdSwitches.map(function (s) {
          return '<span>' + esc(s.at + '  ' + s.from + ' \u2192 ' + s.to) + '</span>'; }).join('') + '</div>';
      }
      h += '</div>';
    }

    if (PD.pending) {
      var p = byId(PD.pending);
      h += '<div class="pd-confirm"><b>Switch today to ' + esc(p.name) + '?</b>' +
        '<p>Switching the day\u2019s array mid-session is logged and shows in the daily review. ' +
        'Trades already logged keep the array they were taken under.</p><div class="row">' +
        '<button class="pd-go" onclick="PD.doSwitch(&quot;' + p.id + '&quot;)">Switch and log it</button>' +
        '<button class="pd-keep" onclick="PD.cancelSwitch()">Keep current</button></div></div>';
    }

    if (picking) {
      h += '<div class="pd-pickhead"><b>' + (cur ? 'Choose the array to switch to' : 'Commit one array for today') + '</b>' +
        (cur ? '<button class="pd-btn pd-btn-ghost" onclick="PD.closePicker()">Cancel</button>' : '') + '</div>';
      var groups = [], gi = {};
      ARRAYS.forEach(function (a) {
        if (cur && a.id === cur.id) return;
        if (gi[a.group] == null) { gi[a.group] = groups.length; groups.push({ name: a.group, items: [] }); }
        groups[gi[a.group]].items.push(a);
      });
      groups.forEach(function (g) {
        h += '<div class="pd-grp"><b>' + esc(g.name) + '</b><div class="pd-cards">' +
          g.items.map(function (a) {
            return '<button class="pd-card" onclick="PD.' + (cur ? 'askSwitch' : 'commit') +
              '(&quot;' + a.id + '&quot;)">' +
              '<span><i>' + esc(a.short) + '</i> <em>' + esc(a.name) + '</em></span>' +
              '<small>' + esc(a.thesis) + '</small></button>';
          }).join('') + '</div></div>';
      });
    }
    host.innerHTML = h;
  };

  /* PERSISTENCE \u2014 the only place that touches your storage. */
  function PD_PERSIST() {
    if (typeof save === 'function') save();
    if (typeof sbSyncRecord === 'function' && typeof _mapDaily === 'function') {
      try { sbSyncRecord('daily', _mapDaily(chain())); } catch (e) {}
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', PD.render);
  else PD.render();
})();
</script>
