<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin, Free & Paid · LMR Capitals</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #080d15; color: #edf2f7; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
      header { padding: 16px 22px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #263344; flex-wrap: wrap; }
      h1 { margin: 0 0 5px; font-size: 18px; }
      header p { margin: 0; color: #a5b4c6; font-size: 11px; }
      label { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-left: auto; }
      select { min-height: 40px; border: 1px solid #415067; border-radius: 6px; background: #101926; color: #edf2f7; padding: 8px 12px; font: inherit; }
      select:focus-visible, a:focus-visible { outline: 2px solid #f0bc59; outline-offset: 3px; }
      main { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(320px, 1fr)); overflow-x: auto; }
      section { min-width: 320px; min-height: 0; display: flex; flex-direction: column; }
      section + section { border-left: 3px solid #263344; }
      .pane-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; background: #101926; border-bottom: 1px solid #263344; }
      h2 { margin: 0; font-size: 12px; font-weight: 700; }
      .badge { font-size: 10px; color: #f1cc87; }
      .badge.free { color: #8fceb2; }
      a { margin-left: auto; font-size: 10px; color: #a5b4c6; text-decoration: none; padding: 8px 0; }
      a:hover { color: #f1cc87; }
      iframe { border: 0; width: 100%; flex: 1; min-height: 0; background: #080d15; }
      @media (max-width: 800px) { header { padding: 12px 16px; gap: 12px; } label { margin-left: 0; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>LMR · Admin, free & paid</h1><p>Interactive previews · Shared sample desk updates · No production writes</p></div>
      <label for="section">Compare section
        <select id="section">
          <option value="overview">Dashboards</option>
          <option value="live">Live analysis</option>
          <option value="observations">LMR observations</option>
          <option value="executions">Execution images</option>
          <option value="achievements">Achievements</option>
          <option value="resources">Free resources</option>
          <option value="questions">Questions & answers</option>
          <option value="mentorship">Private mentorship</option>
          <option value="notifications">Announcements & notifications</option>
        </select>
      </label>
    </header>
    <main>
      <section aria-label="Administration preview">
        <div class="pane-head"><h2>ADMINISTRATION</h2><span class="badge">Publishing desk</span><a id="admin-full" href="/admin/terminal.html?preview=1#overview" target="_blank" rel="noopener">Open full view ↗</a></div>
        <iframe id="admin-preview" title="LMR Admin Terminal preview" src="/admin/terminal.html?preview=1#overview"></iframe>
      </section>
      <section aria-label="Free member preview">
        <div class="pane-head"><h2>FREE MEMBER</h2><span class="badge free">Learning & resources</span><a id="free-full" href="/member/index.html?preview=1&tier=free#dashboard" target="_blank" rel="noopener">Open full view ↗</a></div>
        <iframe id="free-preview" title="LMR free member workspace preview" src="/member/index.html?preview=1&tier=free#dashboard"></iframe>
      </section>
      <section aria-label="Paid member preview">
        <div class="pane-head"><h2>PAID MEMBER</h2><span class="badge">Full member access</span><a id="member-full" href="/member/index.html?preview=1&tier=paid#dashboard" target="_blank" rel="noopener">Open full view ↗</a></div>
        <iframe id="member-preview" title="LMR paid member workspace preview" src="/member/index.html?preview=1&tier=paid#dashboard"></iframe>
      </section>
    </main>
    <script>
      const previewGroup = crypto.randomUUID();
      function showSection(route) {
        const adminUrl = '/admin/terminal.html?preview=1&preview_group=' + previewGroup + '#' + route;
        const memberUrl = '/member/index.html?preview=1&tier=paid&preview_group=' + previewGroup + '#' + (route === 'overview' ? 'dashboard' : route);
        const freeUrl = '/member/index.html?preview=1&tier=free&preview_group=' + previewGroup + '#' + (route === 'overview' ? 'dashboard' : route);
        document.getElementById('admin-preview').src = adminUrl;
        document.getElementById('member-preview').src = memberUrl;
        document.getElementById('free-preview').src = freeUrl;
        document.getElementById('admin-full').href = adminUrl;
        document.getElementById('member-full').href = memberUrl;
        document.getElementById('free-full').href = freeUrl;
      }
      document.getElementById('section').addEventListener('change', (event) => showSection(event.target.value));
      showSection(document.getElementById('section').value);
    </script>
  </body>
</html>
