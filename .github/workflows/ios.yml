# iOS / macOS app (Capacitor shell in ios/) built on a GitHub macOS runner.
#
#  build      — every push/PR touching the native app: compiles the Xcode project
#               (unsigned, simulator) so a broken ios/ change is caught early.
#  testflight — manual (Actions → iOS app → Run workflow → testflight = true):
#               archives, signs with automatic signing via an App Store Connect
#               API key, and uploads the build to TestFlight.
#
# Secrets needed for testflight (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       10-char Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64   the downloaded AuthKey_XXXX.p8, base64-encoded
name: iOS app

on:
  push:
    branches: [main]
    paths: ['ios/**', 'native/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'native/**', 'capacitor.config.json', 'package.json', 'package-lock.json', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Archive and upload to TestFlight
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Capacitor config into ios/
        run: npx cap sync ios
      - name: Build (unsigned, iOS Simulator)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 40
          exit ${PIPESTATUS[0]}

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Check signing secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; exit 1; }
          done
      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          [ -n "$ASC_KEY_P8_BASE64" ] || { echo "::error::Missing secret ASC_KEY_P8_BASE64"; exit 1; }
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 60
          exit ${PIPESTATUS[0]}
      - name: Upload to TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ios/App/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
